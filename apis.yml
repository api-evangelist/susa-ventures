aid: susa-ventures
name: Susa Ventures
description: >-
  Susa Ventures is a San Francisco-based early-stage venture capital firm founded
  in 2013 by Chad Byers, Leo Polovets, and Seth Berman on the belief that founders
  are the lifeblood of progress. Susa is a high-conviction, low-volume seed investor
  that concentrates on data-centric companies with durable competitive moats such as
  proprietary data, economies of scale, and network effects, and it deliberately caps
  each partner at a small handful of active companies so it can operate alongside
  founders in a late-stage, hands-on manner at the earliest stages. The firm invests
  primarily at pre-seed and seed (occasionally Series A), writing initial checks that
  typically range from roughly $1M to $5M across artificial intelligence, fintech,
  healthcare, logistics and supply chain, cybersecurity, developer tools and
  infrastructure, and consumer. Susa is known for a founder-first posture (it avoids
  forcing founders out) and for an unusually high seed-stage unicorn hit rate, with
  notable investments including Robinhood, Flexport, Andela, Newfront, Stord, Human
  Interest, Mux, Stedi, Viz.ai, and Casetext. The firm closed Fund V at $175M in 2025
  and also runs the experimental Humba Ventures vehicle for frontier bets. This profile
  tracks Susa's identity and its portfolio graph across the API Evangelist network.
